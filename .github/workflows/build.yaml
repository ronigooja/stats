name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release tag
        if: github.event_name == 'push'
        id: release
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned app
        run: |
          xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release -archivePath "${{ runner.temp }}/Stats.xcarchive" archive CODE_SIGNING_ALLOWED=NO
          ditto -c -k --sequesterRsrc --keepParent "${{ runner.temp }}/Stats.xcarchive/Products/Applications/Stats.app" "${{ runner.temp }}/Stats.app.zip"
        if: steps.release.outputs.skip != 'true'

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.skip != 'true'
        with:
          name: Stats-unsigned
          path: ${{ runner.temp }}/Stats.app.zip
          if-no-files-found: error
          retention-days: 7
