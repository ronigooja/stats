name: SMC tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run SMC tests
        run: make test-smc
