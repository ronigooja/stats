name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only: upload the unsigned DMG and skip release publishing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          python3 Kit/scripts/changelog.py > CHANGELOG.md
          cat CHANGELOG.md

      - name: Archive
        run: |
          xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Release archive -archivePath build/Stats.xcarchive CODE_SIGNING_ALLOWED=NO
          ditto build/Stats.xcarchive/Products/Applications/Stats.app build/Stats.app

      - name: Verify version
        run: |
          app=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Stats.app/Contents/Info.plist)
          widget=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "build/Stats.app/Contents/PlugIns/WidgetsExtension.appex/Contents/Info.plist")
          echo "app: $app, widget: $widget"
          [ "$app" = "$widget" ] || { echo "ERROR: widget version does not match app version"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            [ "v$app" = "$GITHUB_REF_NAME" ] || { echo "ERROR: app version v$app does not match tag $GITHUB_REF_NAME"; exit 1; }
          fi

      - name: DMG
        run: |
          git clone --depth 1 https://github.com/create-dmg/create-dmg
          ./create-dmg/create-dmg \
            --volname Stats \
            --background "./Stats/Supporting Files/background.png" \
            --window-pos 200 120 \
            --window-size 500 320 \
            --icon-size 80 \
            --icon "Stats.app" 125 175 \
            --hide-extension "Stats.app" \
            --app-drop-link 375 175 \
            --no-internet-enable \
            build/Stats.dmg build/Stats.app
          rm -rf ./create-dmg

      - name: Upload DMG
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: Stats.dmg
          path: build/Stats.dmg
          retention-days: 7

      - name: Publish
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping publishing"
          else
            gh release create "$GITHUB_REF_NAME" build/Stats.dmg \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file CHANGELOG.md
          fi
